<!DOCTYPE html>

    <body class="bg-gray-100 flex flex-col justify-center items-center h-screen font-sans">
        
        <main class="bg-white shadow-2xl rounded-lg w-full max-w-150 p-6 flex flex-col items-center space-y-6">

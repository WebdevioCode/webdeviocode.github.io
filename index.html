<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Main Page</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body class="bg-gray-100 flex flex-col justify-center items-center h-screen font-sans">
        
        <main class="bg-white shadow-2xl rounded-2xl w-full max-w-sm p-6 flex flex-col items-center space-y-6">
            
            <img src="https://avatars.githubusercontent.com/u/217273421?s=400&u=f74b0e0c3242c0e861b9fc4b67b50898050aca2b&v=4" 
                 alt="Profile Avatar" 
                 class="rounded-full w-20 h-20 object-cover shadow-md">
            
            <div class="text-center">
                <h1 class="text-2xl font-bold text-gray-800">Webdev.io</h1>
            </div>

            <div class="text-center">
                <h2 class="text-lg font-semibold text-gray-700 underline underline-offset-4">Socials</h2>
            </div>

            <section class="flex justify-around items-center rounded-2xl w-full shadow-2xl h-40">
                <div>
                    <a href="https://www.tiktok.com/@webdev...io">
                        <img src="https://www.readmecodegen.com/api/social-icon?name=tiktok&size=96&background=%23000000&color=%23ffffff"
                        alt="Tiktok" class="rounded-lg w-15 hover:opacity-90 active:scale-90 mb-2 mt-2 transition">
                    </a>
                </div>
                <div>
                    <a href="https://discord.com/users/1172633652740505672">
                        <img src="https://www.readmecodegen.com/api/social-icon?name=discord&size=96&background=%23000000&theme=dark&color=%233b82f6"
                        alt="Discord" class="rounded-lg w-15 hover:opacity-90 active:scale-90 mb-2 mt-2 transition">
                    </a>
                </div>

                <div>
                    <a href="https://github.com/WebdevioCode">
                        <img src="https://www.readmecodegen.com/api/social-icon?name=github&size=96&background=%23000000&theme=dark&color=%23ffffff"
                        alt="Github" class="rounded-lg w-15 active:scale-90 mb-2 mt-2 transition">
                    </a>
                </div>
            </section>

            <div class="w-full flex flex-col items-center space-y-2">
                <h2 class="text-lg font-semibold text-gray-700 underline underline-offset-4">Programming And Markdown Skills</h2>
            </div>

            <section class="flex flex-col items-center rounded-2xl w-full shadow-2xl">
                <div>
                    <img src="https://skillicons.dev/icons?i=python,cpp,js" alt="Python, C++,JavaScript"/>
                    <img class="mt-3 mb-3" src="https://skillicons.dev/icons?i=html,tailwind,css" alt="Html, TailWindcss, Css"/>
                </div>
            </section>

            <section class="w-full flex justify-center">
                <a href="AllGamesTab.html" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-15 py-2.5 rounded-xl shadow-md cursor-pointer transition-transform active:scale-90">
